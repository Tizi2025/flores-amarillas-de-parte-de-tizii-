<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>flores amarillas de parte de tizii ✨</title>
<meta name="description" content="Una galaxia de girasoles con un agujero negro dorado, fotos y frases flotando.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">

<style>
/* La galaxia es de noche en cualquier tema: los mismos tokens en claro y oscuro. */
:root{
  --void:#030204;
  --ink:#fff4c2;
  --gold:#ffd447;
  --ember:#ff9a1f;
  --dusk:#7b4fd0;
  --glass:rgba(18,11,4,.78);
  --line:rgba(255,212,71,.38);
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Script", "Bradley Hand", cursive;
  --ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --void:#030204; --ink:#fff4c2; --gold:#ffd447; --ember:#ff9a1f; --dusk:#7b4fd0;
    --glass:rgba(18,11,4,.78); --line:rgba(255,212,71,.38);
  }
}
:root[data-theme="dark"]{
  --void:#030204; --ink:#fff4c2; --gold:#ffd447; --ember:#ff9a1f; --dusk:#7b4fd0;
  --glass:rgba(18,11,4,.78); --line:rgba(255,212,71,.38);
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--void);color:var(--ink);
  overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;font-family:var(--ui);
}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}

/* Título */
#title{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;margin:0;padding:0 18px;
  text-align:center;text-wrap:balance;pointer-events:none;z-index:10;
  font:italic 400 clamp(1.55rem,5.6vw,3rem)/1.16 var(--serif);
  color:var(--ink);letter-spacing:.005em;
  text-shadow:0 0 10px rgba(255,212,71,.9),0 0 30px rgba(255,154,31,.6),0 0 60px rgba(255,120,20,.3);
  opacity:0;transition:opacity 2.4s ease 1.4s;
}
body.on #title{opacity:1}

/* Pantalla de inicio */
#start{
  position:fixed;inset:0;z-index:50;border:0;margin:0;padding:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
  background:var(--void);color:var(--ink);cursor:pointer;font-family:var(--ui);
  transition:opacity .9s ease,visibility .9s ease;
}
#start.gone{opacity:0;visibility:hidden;pointer-events:none}
.sun{
  font-size:clamp(76px,24vmin,150px);line-height:1;display:block;
  filter:drop-shadow(0 0 14px rgba(255,212,71,.75)) drop-shadow(0 0 40px rgba(255,150,30,.4));
  animation:respira 3.2s ease-in-out infinite;
}
.cta{font:600 clamp(1.5rem,5vw,2rem)/1.2 var(--hand);color:var(--ink);text-shadow:0 0 8px rgba(255,212,71,.8)}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* Controles */
#dock{
  position:fixed;z-index:30;display:flex;gap:10px;
  right:calc(env(safe-area-inset-right,0px) + 14px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  opacity:0;transition:opacity 1.6s ease 2.4s;
}
body.on #dock{opacity:1}
.round{
  width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;
  background:var(--glass);color:var(--gold);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:background .2s,color .2s,transform .2s;
}
.round:hover{background:rgba(255,212,71,.16);color:var(--ink)}
.round:active{transform:scale(.94)}
.round svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#btn-sound .off{display:none}
#btn-sound.muted .on{display:none}
#btn-sound.muted .off{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#hint{
  position:fixed;z-index:20;left:0;right:0;text-align:center;margin:0;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  font:600 1.35rem/1.2 var(--hand);color:var(--ink);text-shadow:0 0 8px rgba(255,190,40,.7);
  opacity:0;transition:opacity 1.4s ease;
}
#hint.show{opacity:.85}

/* Panel para personalizar */
#panel{
  position:fixed;z-index:40;
  right:calc(env(safe-area-inset-right,0px) + 14px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 72px);
  width:min(390px,calc(100% - 28px));max-height:min(74%,640px);overflow:auto;
  padding:16px 16px 14px;border-radius:18px;
  background:var(--glass);border:1px solid var(--line);color:var(--ink);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  user-select:text;-webkit-user-select:text;
  font:15px/1.45 var(--ui);
}
#panel[hidden]{display:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panel-head h2{margin:0;font:italic 400 1.5rem/1.2 var(--serif);text-shadow:0 0 12px rgba(255,190,40,.5)}
#panel-x{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--gold);font-size:20px;line-height:1;cursor:pointer;
}
.field{display:block;margin:0 0 12px}
.field>span{display:block;margin-bottom:5px;font-weight:600;color:var(--gold)}
.field small{font-weight:400;color:rgba(255,244,194,.7);margin-left:6px}
#panel input[type="text"],#panel textarea{
  width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:rgba(0,0,0,.45);color:var(--ink);font:16px/1.4 var(--ui);resize:vertical;
}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.btn{
  padding:9px 14px;border-radius:999px;border:1px solid var(--gold);background:rgba(255,212,71,.14);
  color:var(--ink);font:600 14px var(--ui);cursor:pointer;transition:background .2s;
}
.btn:hover{background:rgba(255,212,71,.28)}
.btn.ghost{border-color:var(--line);background:transparent;color:rgba(255,244,194,.85)}
.count{font-size:14px;color:rgba(255,244,194,.75)}
.note{margin:6px 0 10px;font-size:13px;color:rgba(255,244,194,.7)}
#msg{min-height:1.3em;margin:6px 0 0;font-size:13px;color:#ffb37a}

@media (prefers-reduced-motion:reduce){
  .sun{animation:none}
  #title,#dock,#hint{transition:none}
}
</style>
</head>
<body>

<canvas id="sky" aria-label="Galaxia de girasoles girando alrededor de un agujero negro dorado"></canvas>

<h1 id="title"></h1>
<p id="hint">Arrastrá para girar la galaxia</p>

<div id="dock">
  <button id="btn-sound" class="round" type="button" aria-label="Sonido" title="Sonido">
    <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></svg>
  </button>
  <button id="btn-edit" class="round" type="button" aria-label="Personalizar" title="Personalizar" aria-controls="panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg>
  </button>
</div>

<section id="panel" role="dialog" aria-labelledby="panel-h" hidden>
  <div class="panel-head">
    <h2 id="panel-h">Hacela tuya</h2>
    <button id="panel-x" type="button" aria-label="Cerrar">×</button>
  </div>

  <label class="field">
    <span>Título</span>
    <input id="f-title" type="text" maxlength="80" autocomplete="off">
  </label>

  <label class="field">
    <span>Frases<small>una por línea</small></span>
    <textarea id="f-phrases" rows="7"></textarea>
  </label>

  <div class="field">
    <span>Fotos</span>
    <div class="row">
      <button id="btn-add" class="btn" type="button">Agregar fotos</button>
      <button id="btn-clear" class="btn ghost" type="button">Quitar fotos</button>
      <span id="photo-count" class="count"></span>
    </div>
    <input id="f-files" type="file" accept="image/*" multiple hidden>
    <p class="note">Las fotos se quedan en este dispositivo. No se suben a ningún lado.</p>
  </div>

  <div class="row">
    <button id="btn-reset" class="btn ghost" type="button">Restaurar original</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
</section>

<button id="start" type="button">
  <span class="sun" aria-hidden="true">🌻</span>
  <span class="cta">Toca para entrar</span>
</button>

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260921);
function randn(){ let u = 0; while (!u) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rng()); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

   ============================================================ */
function freshState(){ return { title: DEFAULTS.title, phrases: DEFAULTS.phrases.slice(), photos: DEFAULTS.photos.slice() }; }
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw), d = freshState();
      return {
        title: typeof s.title === 'string' ? s.title : d.title,
        phrases: Array.isArray(s.phrases) ? s.phrases.filter(x => typeof x === 'string') : d.phrases,
        photos: Array.isArray(s.photos) ? s.photos.filter(x => typeof x === 'string' && x.indexOf('data:image/') === 0) : d.photos
      };
    }
  } catch (e) {}
  return freshState();
}
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
  catch (e) { return false; }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H * 0.56;
  baseU = Math.min(W, H * 0.72) * 0.5 / (R * 1.02);
  bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.72);
  bgGrad.addColorStop(0, 'rgba(62,30,84,0.40)');
  bgGrad.addColorStop(0.4, 'rgba(38,18,26,0.22)');
  bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
}

function glowSprite(r, g, b, size){
  size = size || 48;
  const c = mk(size, size), x = c.getContext('2d'), m = size / 2;
  const gr = x.createRadialGradient(m, m, 0, m, m, m);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.18, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
  gr.addColorStop(0.5, 'rgba(' + r + ',' + g + ',' + b + ',0.22)');
  gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = gr; x.fillRect(0, 0, size, size);
  return c;
}
function softBlob(r, g, b, size){
  size = size || 128;
  const c = mk(size, size), x = c.getContext('2d'), m = size / 2;
  const gr = x.createRadialGradient(m, m, 0, m, m, m);
  gr.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.6)');
  gr.addColorStop(0.5, 'rgba(' + r + ',' + g + ',' + b + ',0.18)');
  gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = gr; x.fillRect(0, 0, size, size);
  return c;
}

/* Tres flores distintas, dibujadas a mano */
function sunflower(x, s){
  const m = s / 2; x.translate(m, m);
  for (let layer = 0; layer < 2; layer++) {
    const n = 14, off = layer ? Math.PI / n : 0;
    const len = m * (layer ? 0.78 : 0.95), wid = m * (layer ? 0.17 : 0.15);
    for (let i = 0; i < n; i++) {
      x.save(); x.rotate(i / n * TAU + off);
      const g = x.createLinearGradient(0, -m * 0.3, 0, -len);
      g.addColorStop(0, layer ? '#ffb61f' : '#ff9d10');
      g.addColorStop(1, layer ? '#ffe066' : '#ffcf3a');
      x.fillStyle = g; x.beginPath();
      x.moveTo(0, -m * 0.28);
      x.quadraticCurveTo(wid * 1.3, -len * 0.6, 0, -len);
      x.quadraticCurveTo(-wid * 1.3, -len * 0.6, 0, -m * 0.28);
      x.fill(); x.restore();
    }
  }
  const cg = x.createRadialGradient(0, 0, 0, 0, 0, m * 0.42);
  cg.addColorStop(0, '#7a4a1a'); cg.addColorStop(0.7, '#3d2210'); cg.addColorStop(1, '#26140a');
  x.fillStyle = cg; x.beginPath(); x.arc(0, 0, m * 0.4, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,196,80,.75)';
  for (let i = 1; i < 38; i++) {
    const a = i * 2.39996, rr = Math.sqrt(i / 38) * m * 0.36;
    x.beginPath(); x.arc(Math.cos(a) * rr, Math.sin(a) * rr, m * 0.024, 0, TAU); x.fill();
  }
}
function buttercup(x, s){
  const m = s / 2; x.translate(m, m);
  for (let i = 0; i < 5; i++) {
    x.save(); x.rotate(i / 5 * TAU);
    const g = x.createRadialGradient(0, -m * 0.5, 0, 0, -m * 0.5, m * 0.5);
    g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ffc21a');
    x.fillStyle = g; x.beginPath(); x.ellipse(0, -m * 0.52, m * 0.34, m * 0.44, 0, 0, TAU); x.fill();
    x.strokeStyle = 'rgba(255,140,0,.35)'; x.lineWidth = m * 0.03; x.stroke();
    x.restore();
  }
  const cg = x.createRadialGradient(0, 0, 0, 0, 0, m * 0.2);
  cg.addColorStop(0, '#ffb000'); cg.addColorStop(1, '#e07a00');
  x.fillStyle = cg; x.beginPath(); x.arc(0, 0, m * 0.2, 0, TAU); x.fill();
}
function daisy(x, s){
  const m = s / 2; x.translate(m, m);
  const n = 18;
  for (let i = 0; i < n; i++) {
    x.save(); x.rotate(i / n * TAU);
    x.fillStyle = i % 2 ? '#ffe680' : '#ffd23f';
    x.beginPath(); x.ellipse(0, -m * 0.66, m * 0.09, m * 0.32, 0, 0, TAU); x.fill();
    x.restore();
  }
  const cg = x.createRadialGradient(0, 0, 0, 0, 0, m * 0.3);
  cg.addColorStop(0, '#ffcf40'); cg.addColorStop(1, '#f08a00');
  x.fillStyle = cg; x.beginPath(); x.arc(0, 0, m * 0.3, 0, TAU); x.fill();
}
function flowerSprite(fn){
  const s = 128, c = mk(s, s), x = c.getContext('2d');
  x.translate(s / 2, s / 2); x.scale(0.86, 0.86); x.translate(-s / 2, -s / 2);
  x.shadowColor = 'rgba(255,190,0,.75)'; x.shadowBlur = 6;
  fn(x, s);
  return c;
}
const FL = [flowerSprite(sunflower), flowerSprite(buttercup), flowerSprite(daisy)];

/* ============================================================
   Galaxia: estrellas, nebulosa, flores, disco de acreción
   ============================================================ */
const ARMS = 3, TWIST = 0.0135;
const armAngle = (arm, r) => arm / ARMS * TAU + r * TWIST;

const mobile = Math.min(window.innerWidth, window.innerHeight) < 600;
const NS = mobile ? 2000 : 3400;
const S = { n: NS, x: new Float32Array(NS), y: new Float32Array(NS), z: new Float32Array(NS),
            ph: new Float32Array(NS), sp: new Float32Array(NS), sz: new Float32Array(NS),
            a: new Float32Array(NS), c: new Uint8Array(NS) };
const SX = new Float32Array(NS), SY = new Float32Array(NS), SZ = new Float32Array(NS), SPP = new Float32Array(NS);
for (let i = 0; i < NS; i++) {
  const r = 118 + (R - 118) * Math.pow(rng(), 1.5) + randn() * 6;
  const th = rng() < 0.28 ? rng() * TAU : armAngle(i % ARMS, r) + randn() * (0.15 + 0.32 * (r / R));
  S.x[i] = r * Math.cos(th); S.z[i] = r * Math.sin(th);
  S.y[i] = randn() * (7 * (1 - r / R) + 2);
  S.ph[i] = rng() * TAU; S.sp[i] = 0.6 + rng() * 2.2;
  S.sz[i] = rng() < 0.03 ? 22 + rng() * 10 : 8 + rng() * 12;
  S.a[i] = 0.45 + rng() * 0.55;
  const k = rng();
  S.c[i] = k < 0.30 ? 0 : k < 0.60 ? 1 : k < 0.80 ? 2 : k < 0.94 ? 3 : 4;
}

const NEB = [];
for (let i = 0; i < 30; i++) {
  const r = 130 + rng() * 190, th = armAngle(i % ARMS, r) + randn() * 0.18;
  const k = rng();
  NEB.push({ x: r * Math.cos(th), z: r * Math.sin(th), y: randn() * 6, sz: 90 + rng() * 120,
             a: 0.06 + rng() * 0.07, spr: k < 0.4 ? 0 : k < 0.7 ? 1 : 2 });
}

const FLOWERS = [];
for (let i = 0; i < 150; i++) {
  const hero = i < 14;
  const r = 128 + (R * 0.96 - 128) * Math.pow(rng(), 1.05);
  const th = armAngle(i % ARMS, r) + randn() * 0.2;
  FLOWERS.push({ kind: 0, x0: r * Math.cos(th), z0: r * Math.sin(th), y0: randn() * 8,
                 sz: hero ? 30 + rng() * 10 : 13 + rng() * 15, type: i % 3,
                 rot0: rng() * TAU, spd: (rng() < 0.5 ? -1 : 1) * (0.15 + rng() * 0.5), ph: rng() * TAU,
                 sx: 0, sy: 0, z: 0, p: 1 });
}

const ND = mobile ? 650 : 950, DISC_R0 = RH * 1.32, DISC_R1 = RH * 3.6;
const A = { th0: new Float32Array(ND), r: new Float32Array(ND), y: new Float32Array(ND),
            w: new Float32Array(ND), sz: new Float32Array(ND), heat: new Uint8Array(ND) };
const AX = new Float32Array(ND), AY = new Float32Array(ND), AZ = new Float32Array(ND),
      AP = new Float32Array(ND), AD = new Float32Array(ND), AL = new Float32Array(ND);
for (let i = 0; i < ND; i++) {
  const f = Math.pow(rng(), 0.8), r = DISC_R0 + (DISC_R1 - DISC_R0) * f;
  A.th0[i] = rng() * TAU; A.r[i] = r; A.y[i] = randn() * 1.6;
  A.w[i] = 1.3 * Math.pow(DISC_R0 / r, 1.5);
  A.sz[i] = 8 + rng() * 10;
  A.heat[i] = Math.min(5, Math.floor(f * 6));
}

/* Fondo: estrellitas fijas y pétalos que caen */
const BG = [];
for (let i = 0; i < 240; i++) BG.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.1, ph: rng() * TAU, sp: 0.5 + rng() * 2 });
const PETALS = [];
if (!REDUCED) for (let i = 0; i < 38; i++) PETALS.push({ x: rng(), y: rng(), vy: 12 + rng() * 26, ph: rng() * TAU,
  sz: 2.5 + rng() * 4.5, rot: rng() * TAU, rv: (rng() - 0.5) * 2, a: 0.25 + rng() * 0.4 });

/* ============================================================
   Fotos (polaroids) y frases flotantes
   ============================================================ */
function roundRect(x, px, py, w, h, r){
  x.beginPath(); x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath();
}
function polaroid(img){
  const w = 232, h = 272, c = mk(w, h), x = c.getContext('2d');
  x.shadowColor = 'rgba(255,200,60,.6)'; x.shadowBlur = 14;
  x.fillStyle = '#fff8e1'; roundRect(x, 8, 8, w - 16, h - 16, 6); x.fill();
  x.shadowBlur = 0;
  const px = 20, py = 20, ps = w - 40;
  if (img) {
    const s = Math.min(img.width, img.height);
    x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, px, py, ps, ps);
  } else {
    const g = x.createLinearGradient(0, py, 0, py + ps);
    g.addColorStop(0, '#3a2306'); g.addColorStop(1, '#120a02');
    x.fillStyle = g; x.fillRect(px, py, ps, ps);
    x.drawImage(FL[0], px + ps / 2 - 56, py + ps / 2 - 70, 112, 112);
    x.fillStyle = 'rgba(255,236,170,.92)'; x.font = '600 24px Caveat, "Segoe Script", cursive';
    x.textAlign = 'center'; x.fillText('tu foto acá', w / 2, py + ps - 14);
  }
  x.strokeStyle = 'rgba(0,0,0,.28)'; x.lineWidth = 1; x.strokeRect(px + 0.5, py + 0.5, ps - 1, ps - 1);
  x.drawImage(FL[2], w / 2 - 15, h - 52, 30, 30);
  return c;
}
function wrapText(text){
  const words = text.split(/\s+/), n = Math.max(1, Math.ceil(text.length / 18)), max = Math.ceil(text.length / n) + 3;
  const lines = []; let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}

let items = [];
function buildItems(){
  const phr = state.phrases.map(s => s.trim()).filter(Boolean).slice(0, 24);
  const pics = state.photos.slice(0, MAX_PHOTOS);
  const photoSrc = pics.length ? pics : [null, null, null, null];
  const n = phr.length + photoSrc.length;
  const slots = new Set();
  for (let k = 0; k < photoSrc.length; k++) slots.add(Math.min(n - 1, Math.floor((k + 0.5) * n / photoSrc.length)));
  const out = []; let ia = 0, ib = 0;
  for (let i = 0; i < n; i++) {
    const usePhoto = (slots.has(i) && ib < photoSrc.length) || ia >= phr.length;
    const base = { ang: 0.35 + i / n * TAU, r: [205, 262, 228, 292][i % 4],
                   y: 24 + 22 * Math.sin(i * 2.1), ph: rng() * TAU, tilt: (rng() - 0.5) * 0.12,
                   sx: 0, sy: 0, z: 0, p: 1 };
    base.x0 = base.r * Math.cos(base.ang); base.z0 = base.r * Math.sin(base.ang);
    if (usePhoto) {
      base.kind = 1; base.sprite = null;
      const src = photoSrc[ib++];
      if (src) {
        const img = new Image();
        img.onload = () => { base.sprite = polaroid(img); };
        img.src = src;
      } else base.sprite = polaroid(null);
    } else {
      base.kind = 2; base.lines = wrapText(phr[ia++]);
    }
    out.push(base);
  }
  items = out;
}

/* ============================================================
   Dibujo
   ============================================================ */
const drawList = [];
let SPARE = 0;

function drawBackdrop(t, ease){
  ctx.fillStyle = '#fff6dc';
  for (let i = 0; i < BG.length; i++) {
    const b = BG[i];
    ctx.globalAlpha = (0.2 + 0.55 * (0.5 + 0.5 * Math.sin(t * b.sp + b.ph))) * ease;
    ctx.fillRect(b.x * W, b.y * H, b.r, b.r);
  }
  ctx.globalAlpha = 1;
}

function drawNebula(cg, sg, ease){
  ctx.globalCompositeOperation = 'lighter';
  // bulbo central cálido
  let d = 420 * U;
  ctx.globalAlpha = 0.5 * ease;
  ctx.drawImage(bulgeSpr, CX - d / 2, CY - d / 2, d, d);
  for (let i = 0; i < NEB.length; i++) {
    const n = NEB[i];
    const x1 = n.x * cg + n.z * sg, z1 = -n.x * sg + n.z * cg;
    const y2 = n.y * cb + z1 * sb, z2 = z1 * cb - n.y * sb;
    const p = 1 / (1 + z2 / D);
    d = n.sz * 2 * U * p;
    ctx.globalAlpha = n.a * ease;
    ctx.drawImage(blobSpr[n.spr], CX + x1 * U * p - d / 2, CY - y2 * U * p - d / 2, d, d);
  }
  ctx.globalAlpha = 1;
}

function prepStars(cg, sg){
  const n = Math.floor(S.n * quality);
  for (let i = 0; i < n; i++) {
    const x = S.x[i], y = S.y[i], z = S.z[i];
    const x1 = x * cg + z * sg, z1 = -x * sg + z * cg;
    const y2 = y * cb + z1 * sb, z2 = z1 * cb - y * sb;
    const p = 1 / (1 + z2 / D);
    SX[i] = CX + x1 * U * p; SY[i] = CY - y2 * U * p; SZ[i] = z2; SPP[i] = p;
  }
}
function drawStars(back, t, ease){
  ctx.globalCompositeOperation = 'lighter';
  const n = Math.floor(S.n * quality);
  for (let i = 0; i < n; i++) {
    if ((SZ[i] > 0) !== back) continue;
    const sx = SX[i], sy = SY[i];
    if (sx < -24 || sx > W + 24 || sy < -24 || sy > H + 24) continue;
    const d = S.sz[i] * U * SPP[i];
    ctx.globalAlpha = S.a[i] * (0.72 + 0.28 * Math.sin(t * S.sp[i] + S.ph[i])) * ease;
    ctx.drawImage(starSpr[S.c[i]], sx - d / 2, sy - d / 2, d, d);
  }
  ctx.globalAlpha = 1;
}

function prepDisc(t, cy, sy){
  const n = Math.floor(ND * quality), spd = REDUCED ? 0.4 : 1;
  for (let i = 0; i < n; i++) {
    const th = A.th0[i] + A.w[i] * t * spd, r = A.r[i];
    const x = r * Math.cos(th), z = r * Math.sin(th), y = A.y[i];
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    const y2 = y * cb + z1 * sb, z2 = z1 * cb - y * sb;
    const p = 1 / (1 + z2 / D);
    AX[i] = CX + x1 * U * p; AY[i] = CY - y2 * U * p; AZ[i] = z2; AP[i] = p; AL[i] = x1;
    // efecto Doppler: el lado que se acerca brilla más
    const vx = -Math.sin(th) * cy + Math.cos(th) * sy;
    AD[i] = clamp(0.3 + 0.75 * (0.62 + 0.5 * vx), 0.15, 1);
  }
}
function drawDisc(back, ease){
  ctx.globalCompositeOperation = 'lighter';
  const n = Math.floor(ND * quality);
  for (let i = 0; i < n; i++) {
    if ((AZ[i] > 0) !== back) continue;
    const d = A.sz[i] * U * AP[i];
    ctx.globalAlpha = AD[i] * ease;
    ctx.drawImage(heatSpr[A.heat[i]], AX[i] - d / 2, AY[i] - d / 2, d, d);
  }
  ctx.globalAlpha = 1;
}
/* La luz de atrás del disco se curva por encima y por debajo del agujero */
function drawLens(ease, pitch){
  ctx.globalCompositeOperation = 'lighter';
  const k = 0.4 + 0.6 * Math.cos(pitch), n = Math.floor(ND * quality);
  for (let i = 0; i < n; i += 2) {
    if (AZ[i] <= 0) continue;
    const rho = A.r[i] * U * 0.9, dx = AL[i] * U * AP[i];
    if (Math.abs(dx) >= rho) continue;
    const yl = Math.sqrt(rho * rho - dx * dx), d = A.sz[i] * U * 0.9;
    const spr = heatSpr[Math.min(5, A.heat[i] + 1)];
    ctx.globalAlpha = AD[i] * 0.5 * k * ease;
    ctx.drawImage(spr, CX + dx - d / 2, CY - yl - d / 2, d, d);
    ctx.globalAlpha = AD[i] * 0.26 * k * ease;
    ctx.drawImage(spr, CX + dx - d / 2, CY + yl * 0.9 - d / 2, d, d);
  }
  ctx.globalAlpha = 1;
}

function drawHole(ease){
  // resplandor detrás
  ctx.globalCompositeOperation = 'lighter';
  const g = RH * 8 * U;
  ctx.globalAlpha = 0.55 * ease;
  ctx.drawImage(heatSpr[3], CX - g / 2, CY - g / 2, g, g);
  // el agujero
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(CX, CY, RH * U, 0, TAU); ctx.fill();
  // anillo de fotones
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = ease;
  ctx.lineWidth = Math.max(1.5, RH * U * 0.07);
  ctx.strokeStyle = 'rgba(255,238,180,0.95)';
  ctx.shadowColor = 'rgba(255,180,40,1)'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(CX, CY, RH * U * 1.04, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function gatherSprites(t, cg, sg){
  drawList.length = 0;
  for (let i = 0; i < FLOWERS.length; i++) {
    const f = FLOWERS[i];
    const y = f.y0 + Math.sin(t * 0.7 + f.ph) * 3;
    const x1 = f.x0 * cg + f.z0 * sg, z1 = -f.x0 * sg + f.z0 * cg;
    const y2 = y * cb + z1 * sb, z2 = z1 * cb - y * sb;
    f.p = 1 / (1 + z2 / D); f.z = z2;
    f.sx = CX + x1 * U * f.p; f.sy = CY - y2 * U * f.p;
    drawList.push(f);
  }
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const y = it.y + Math.sin(t * 0.8 + it.ph) * 7;
    const x1 = it.x0 * cg + it.z0 * sg, z1 = -it.x0 * sg + it.z0 * cg;
    const y2 = y * cb + z1 * sb, z2 = z1 * cb - y * sb;
    it.p = 1 / (1 + z2 / D); it.z = z2;
    it.sx = CX + x1 * U * it.p; it.sy = CY - y2 * U * it.p;
    drawList.push(it);
  }
  drawList.sort((a, b) => b.z - a.z);
}
function drawSprite(e, t, ease){
  if (e.sx < -160 || e.sx > W + 160 || e.sy < -160 || e.sy > H + 160) return;
  const depth = clamp(1 - e.z / (R * 2.6), 0.4, 1) * ease;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = depth;
  if (e.kind === 0) {
    const d = e.sz * 2 * U * e.p, k = 0.42 + 0.58 * sb;
    ctx.save(); ctx.translate(e.sx, e.sy); ctx.scale(1, k); ctx.rotate(e.rot0 + t * e.spd);
    ctx.drawImage(FL[e.type], -d / 2, -d / 2, d, d);
    ctx.restore();
  } else if (e.kind === 1) {
    if (!e.sprite) return;
    const w = 118 * U * e.p, h = w * 272 / 232;
    ctx.save(); ctx.translate(e.sx, e.sy); ctx.rotate(e.tilt + Math.sin(t * 0.6 + e.ph) * 0.05);
    ctx.drawImage(e.sprite, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else {
    const fs = Math.max(11, 31 * U * e.p);
    ctx.save(); ctx.translate(e.sx, e.sy); ctx.rotate(Math.sin(t * 0.5 + e.ph) * 0.03);
    ctx.font = '600 ' + fs.toFixed(1) + 'px Caveat, "Segoe Script", "Bradley Hand", cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff6cf';
    ctx.shadowColor = 'rgba(255,190,30,.95)'; ctx.shadowBlur = 10;
    const n = e.lines.length;
    for (let i = 0; i < n; i++) ctx.fillText(e.lines[i], 0, (i - (n - 1) / 2) * fs * 1.06);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawPetals(t, dt, ease){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffd23f';
  for (let i = 0; i < PETALS.length; i++) {
    const p = PETALS[i];
    p.y += p.vy * dt / H; p.rot += p.rv * dt;
    if (p.y > 1.03) { p.y = -0.03; p.x = rng(); }
    const x = p.x * W + Math.sin(t * 0.6 + p.ph) * 14, y = p.y * H;
    ctx.globalAlpha = p.a * ease;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
    ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function introEase(t){
  if (!started) return 0;
  const k = clamp((t - t0) / 4.5, 0, 1);
  return 1 - Math.pow(1 - k, 3);
}

function render(t, dt){
  const ease = introEase(t);
  U = baseU * cam.zoom * (0.62 + 0.38 * ease);
  const pitch = clamp(cam.pitch + 0.05 * Math.sin(t * 0.23), 0.2, 1.5);
  cb = Math.cos(pitch); sb = Math.sin(pitch);
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cg = Math.cos(cam.yaw + gal), sg = Math.sin(cam.yaw + gal);

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#030204'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  drawBackdrop(t, ease);
  drawNebula(cg, sg, ease);

  prepStars(cg, sg); prepDisc(t, cy, sy); gatherSprites(t, cg, sg);

  // 1) todo lo que está detrás del agujero
  drawStars(true, t, ease);
  drawDisc(true, ease);
  for (let i = 0; i < drawList.length; i++) if (drawList[i].z > 0) drawSprite(drawList[i], t, ease);
  // 2) el agujero negro y la luz curvada
  drawHole(ease);
  drawLens(ease, pitch);
  // 3) lo que pasa por delante
  drawDisc(false, ease);
  for (let i = 0; i < drawList.length; i++) if (drawList[i].z <= 0) drawSprite(drawList[i], t, ease);
  drawStars(false, t, ease);
  drawPetals(t, dt, ease);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* ============================================================
   Bucle, inercia y calidad adaptable
   ============================================================ */
let last = 0, avg = 16.7, frames = 0;
function frame(now){
  const t = now / 1000;
  const raw = last ? t - last : 0.016;
  last = t;
  const dt = Math.min(0.05, raw);

  gal += dt * (REDUCED ? 0.02 : 0.055);
  if (!cam.drag) {
    cam.yaw += cam.vy * dt * 60; cam.pitch = clamp(cam.pitch + cam.vp * dt * 60, 0.2, 1.5);
    const f = Math.pow(0.04, dt); cam.vy *= f; cam.vp *= f;
  }
  render(t, dt);

  if (started && raw < 0.1) {
    avg = avg * 0.94 + raw * 1000 * 0.06;
    if (++frames % 90 === 0 && avg > 26 && quality > 0.45) quality = Math.max(0.45, quality - 0.15);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   Interacción: arrastrar, pellizcar, rueda
   ============================================================ */
const ptrs = new Map(); let pinchD = 0;
const pdist = () => { const v = Array.from(ptrs.values()); return Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y); };
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.drag = true; cam.vy = 0; cam.vp = 0; cv.classList.add('drag');
  if (ptrs.size === 2) pinchD = pdist();
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    cam.yaw += dx * 0.006; cam.pitch = clamp(cam.pitch + dy * 0.004, 0.2, 1.5);
    cam.vy = dx * 0.006; cam.vp = dy * 0.004;
  } else if (ptrs.size === 2) {
    const d = pdist();
    if (pinchD > 0) cam.zoom = clamp(cam.zoom * d / pinchD, 0.6, 2.4);
    pinchD = d;
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchD = 0;
  if (ptrs.size === 0) { cam.drag = false; cv.classList.remove('drag'); }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0012), 0.6, 2.4);
}, { passive: false });

/* ============================================================
   Música ambiental generada con Web Audio (sin archivos)
   ============================================================ */
let actx = null, master = null, soundOn = true, sparkleT = 0;
const btnSound = $('btn-sound');
function impulse(c, dur, decay){
  const len = Math.floor(c.sampleRate * dur), b = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return b;
}
function startAudio(){
  if (actx) { if (soundOn) actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { btnSound.hidden = true; return; }
  try {
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
    const rev = actx.createConvolver(); rev.buffer = impulse(actx, 3.4, 2.6);
    const wet = actx.createGain(); wet.gain.value = 0.6; rev.connect(wet); wet.connect(master);
    const dry = actx.createGain(); dry.gain.value = 0.7; dry.connect(master);
    const bus = actx.createGain(); bus.connect(dry); bus.connect(rev);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(bus);
    [146.83, 220, 293.66, 369.99, 440].forEach((f, i) => {
      const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = (i % 2 ? 5 : -5);
      const g = actx.createGain(); g.gain.value = 0.05;
      const lfo = actx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.017;
      const lg = actx.createGain(); lg.gain.value = 0.035;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(lp); o.start(); lfo.start();
    });
    const notes = [587.33, 659.25, 739.99, 880, 987.77, 1174.66];
    const sparkle = () => {
      if (actx && soundOn && actx.state === 'running') {
        const n = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = notes[Math.floor(Math.random() * notes.length)];
        g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.13, n + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, n + 2.4);
        o.connect(g); g.connect(bus); o.start(n); o.stop(n + 2.5);
      }
      sparkleT = setTimeout(sparkle, 2200 + Math.random() * 3400);
    };
    sparkle();
    master.gain.linearRampToValueAtTime(0.5, actx.currentTime + 4);
    if (actx.state === 'suspended') actx.resume();
  } catch (err) { actx = null; btnSound.hidden = true; }
}
btnSound.addEventListener('click', () => {
  soundOn = !soundOn;
  btnSound.classList.toggle('muted', !soundOn);
  if (!actx) { if (soundOn) startAudio(); return; }
  const n = actx.currentTime;
  master.gain.cancelScheduledValues(n);
  master.gain.setTargetAtTime(soundOn ? 0.5 : 0, n, 0.25);
  if (soundOn) actx.resume();
});
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else if (soundOn) actx.resume();
});

/* ============================================================
   Inicio
   ============================================================ */
const startBtn = $('start'), hint = $('hint');
startBtn.addEventListener('click', () => {
  startBtn.classList.add('gone');
  document.body.classList.add('on');
  started = true; t0 = performance.now() / 1000;
  startAudio();
  setTimeout(() => hint.classList.add('show'), 4200);
  setTimeout(() => hint.classList.remove('show'), 10500);
});

/* ============================================================
   Panel para personalizar
   ============================================================ */
const titleEl = $('title'), panel = $('panel'), btnEdit = $('btn-edit');
const fTitle = $('f-title'), fPhrases = $('f-phrases'), fFiles = $('f-files');
const countEl = $('photo-count'), msgEl = $('msg');
let phraseTimer = 0;

function applyTitle(){ titleEl.textContent = state.title; document.title = 'flores amarillas de parte de tizii ✨'; }
function say(t){ msgEl.textContent = t || ''; }
function updateCount(){
  const n = state.photos.length;
  countEl.textContent = n ? n + (n === 1 ? ' foto' : ' fotos') + ' (máx. ' + MAX_PHOTOS + ')' : 'Todavía no hay fotos';
}
function fillPanel(){
  fTitle.value = state.title; fPhrases.value = state.phrases.join('\n'); updateCount(); say('');
}
function persist(){ if (!saveState()) say('No pude guardar los cambios en este navegador. Se mantienen mientras la página esté abierta.'); }

function togglePanel(open){
  const show = typeof open === 'boolean' ? open : panel.hidden;
  panel.hidden = !show; btnEdit.setAttribute('aria-expanded', String(show));
  if (show) { fillPanel(); fTitle.focus({ preventScroll: true }); } else btnEdit.focus({ preventScroll: true });
}
btnEdit.addEventListener('click', () => togglePanel());
$('panel-x').addEventListener('click', () => togglePanel(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) togglePanel(false); });

fTitle.addEventListener('input', () => { state.title = fTitle.value; applyTitle(); persist(); });
fPhrases.addEventListener('input', () => {
  state.phrases = fPhrases.value.split('\n');
  clearTimeout(phraseTimer);
  phraseTimer = setTimeout(() => { buildItems(); persist(); }, 300);
});

function squarePhoto(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const side = Math.min(img.width, img.height), out = Math.min(420, side), c = mk(out, out);
          c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, out, out);
          resolve(c.toDataURL('image/jpeg', 0.84));
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('img'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
$('btn-add').addEventListener('click', () => fFiles.click());
fFiles.addEventListener('change', async () => {
  const files = Array.from(fFiles.files || []); fFiles.value = '';
  if (!files.length) return;
  say('Cargando fotos…');
  let bad = 0, full = false;
  for (const f of files) {
    if (state.photos.length >= MAX_PHOTOS) { full = true; break; }
    try { state.photos.push(await squarePhoto(f)); } catch (e) { bad++; }
  }
  buildItems(); updateCount(); persist();
  if (full) say('Llegaste al máximo de ' + MAX_PHOTOS + ' fotos.');
  else if (bad) say('No pude abrir ' + bad + (bad === 1 ? ' imagen' : ' imágenes') + '. Probá con JPG o PNG.');
  else if (msgEl.textContent === 'Cargando fotos…') say('');
});
$('btn-clear').addEventListener('click', () => { state.photos = []; buildItems(); updateCount(); persist(); say('Quité las fotos.'); });
$('btn-reset').addEventListener('click', () => {
  state = freshState();
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  applyTitle(); buildItems(); fillPanel(); say('Volvió al original.');
});

/* ============================================================
   Arranque
   ============================================================ */
window.addEventListener('resize', resize);
resize(); applyTitle(); buildItems();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('600 24px Caveat'), document.fonts.load('italic 400 24px Fraunces')])
    .then(buildItems).catch(() => {});
}
requestAnimationFrame(frame);
})();
</script>
